# SLG OS stack (PRD-0003 SK-16): proxy, Keycloak, PostgreSQL and the core backend. The reference module and the LDAP test
# directory join in later milestones and in compose.e2e.yaml.
#
#   deploy/scripts/gen-secrets.sh       generate secret files (development and CI; production uses the operator's secrets)
#   deploy/scripts/test-ca.sh           generate a throw-away CA and the proxy certificate (test host names only)
#   docker compose -f deploy/compose.yaml up -d --build
#
# Hardening (SK-16 AC3): non-root user, read-only root file system with explicit tmpfs, all capabilities dropped,
# no-new-privileges, pids limit, no published port except the proxy on 443, JSON logs with rotation.
# Exceptions, each with its reason:
#   - keycloak: writable /opt/keycloak/data (import and temporary files of the server)

name: slgos

x-service: &service
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    <<: *service
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    user: "999:999"
    read_only: true
    mem_limit: 2g
    cpus: 2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets: [pg_superuser, db_app_password, db_migrator_password, kc_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  keycloak:
    <<: *service
    build:
      context: ./keycloak
    image: slgos/keycloak:local
    mem_limit: 1536m
    cpus: 2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://${SLG_SSO_HOST:-sso.slg.test}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_TRUSTSTORE_PATHS: /etc/slg/ca/ca.crt
      SLG_SHELL_BASE_URL: https://${SLG_SHELL_HOST:-shell.slg.test}
      # Active Directory federation of the production realm (deploy/keycloak/realm.json). The defaults are placeholders that
      # never connect; the operator sets the real values (docs/operations/configuration.md).
      LDAP_URL: ${LDAP_URL:-ldaps://directory.invalid:636}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-cn=svc-slg,dc=example,dc=invalid}
      LDAP_USERS_DN: ${LDAP_USERS_DN:-dc=example,dc=invalid}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=60"
    secrets: [kc_db_password, kc_bootstrap_admin_password, slg_core_client_secret, ldap_bind_password]
    volumes:
      - ./.generated/tls/ca.crt:/etc/slg/ca/ca.crt:ro
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    tmpfs:
      - /tmp
      - /opt/keycloak/data/tmp
    # backend has no route out; egress lets Keycloak reach the directory server (ports 389/636) of the company network.
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -Eq '\"status\": ?\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  core-backend:
    <<: *service
    build:
      context: ..
      dockerfile: backend/core/Dockerfile
    image: slgos/core:local
    user: "10001:10001"
    read_only: true
    mem_limit: 1536m
    cpus: 2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SLG_ENV: ${SLG_ENV:-production}
      SLG_SHELL_BASE_URL: https://${SLG_SHELL_HOST:-shell.slg.test}
      SLG_INTERNAL_HOSTS: core-backend
      # Only the proxy (fixed address below) may set X-Forwarded-For and the correlation id.
      SLG_TRUSTED_PROXY_CIDRS: 172.29.0.2/32
      SLG_OIDC_ISSUER: https://${SLG_SSO_HOST:-sso.slg.test}/realms/${SLG_REALM:-slg}
      SLG_OIDC_CLIENT_SECRET_FILE: /run/secrets/slg_core_client_secret
      SLG_SESSION_VAULT_KEYS_FILE: /run/secrets/session_vault_keys
      SLG_SESSION_VAULT_ACTIVE_KEY_ID: k1
      SLG_SESSION_CSRF_KEY_FILE: /run/secrets/session_csrf_key
      SLG_DB_URL: jdbc:postgresql://postgres:5432/platform
      SLG_DB_APP_USER: slg_app
      SLG_DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      SLG_DB_MIGRATOR_USER: slg_migrator
      SLG_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError
        -Djavax.net.ssl.trustStore=/etc/slg/ca/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=changeit
    secrets: [slg_core_client_secret, session_vault_keys, session_csrf_key, db_app_password, db_migrator_password]
    volumes:
      - ./.generated/ca/truststore.p12:/etc/slg/ca/truststore.p12:ro
    tmpfs:
      - /tmp
    networks: [backend]
    healthcheck:
      # Readiness on the management port; DEGRADED (Keycloak absent) is still HTTP 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  proxy:
    <<: *service
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    user: "101:101"
    read_only: true
    mem_limit: 256m
    cpus: 1
    depends_on:
      core-backend:
        condition: service_started
    ports:
      - "443:8443"
    sysctls:
      # Lets the unprivileged nginx bind 443 inside the container: the core calls https://sso.slg.test on the default port.
      net.ipv4.ip_unprivileged_port_start: 443
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/slg-proxy-headers.conf:/etc/nginx/slg-proxy-headers.conf:ro
      - ./.generated/tls:/etc/slg/tls:ro
    tmpfs:
      - /tmp
    networks:
      edge: {}
      backend:
        ipv4_address: 172.29.0.2
        aliases:
          # Inside the stack the public host names resolve to the proxy, so the core reaches Keycloak by its issuer URL.
          - ${SLG_SHELL_HOST:-shell.slg.test}
          - ${SLG_SSO_HOST:-sso.slg.test}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  edge: {}
  egress: {}
  backend:
    internal: true
    ipam:
      config:
        # Dynamic addresses come from ip_range so that the proxy can hold the fixed 172.29.0.2 (the only trusted proxy address).
        - subnet: 172.29.0.0/16
          ip_range: 172.29.1.0/24

volumes:
  pgdata: {}

secrets:
  pg_superuser:
    file: ./.generated/secrets/pg_superuser
  db_app_password:
    file: ./.generated/secrets/db_app_password
  db_migrator_password:
    file: ./.generated/secrets/db_migrator_password
  kc_db_password:
    file: ./.generated/secrets/kc_db_password
  kc_bootstrap_admin_password:
    file: ./.generated/secrets/kc_bootstrap_admin_password
  slg_core_client_secret:
    file: ./.generated/secrets/slg_core_client_secret
  ldap_bind_password:
    file: ./.generated/secrets/ldap_bind_password
  session_vault_keys:
    file: ./.generated/secrets/session_vault_keys
  session_csrf_key:
    file: ./.generated/secrets/session_csrf_key
