# Headers the proxy sets towards every upstream. Inbound X-Forwarded-*, Forwarded and identity headers are overwritten or
# cleared, never appended: the core takes the client address from the proxy and nothing else (PRD-0003 SK-5 AC4).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Correlation-Id $request_id;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_connect_timeout 5s;
