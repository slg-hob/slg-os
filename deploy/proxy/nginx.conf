# Reverse proxy of the stack (PRD-0003 SK-3, SK-15 AC1, SK-16). Runs as the unprivileged nginx user on 8443 (published as 443) and on 443 inside the stack network, where the
# core reaches Keycloak by its public issuer URL.
# Two host names: the shell/core host and the Keycloak host. Upstreams are resolved at request time, so a missing upstream
# yields a 502 page and not a start failure.

worker_processes auto;
pid /tmp/nginx.pid;
# crit: the error log repeats the request line including the query string (authorization code), so it stays quiet.
error_log /dev/stderr crit;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # Redirects carry the path only: the container listens on 8443 while the browser uses 443.
  absolute_redirect off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Docker's embedded DNS; short validity so a restarted upstream is found again.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # The access log carries the path without the query string: the callback URL holds the authorization code (SK-3 AC2).
  log_format slg escape=json '{"time":"$time_iso8601","remote":"$remote_addr","host":"$host","method":"$request_method",'
                             '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,"request_id":"$request_id"}';
  access_log /dev/stdout slg;

  ssl_certificate /etc/slg/tls/tls.crt;
  ssl_certificate_key /etc/slg/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:ssl:2m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  # Health check for the container itself, reachable only from inside it.
  server {
    listen 127.0.0.1:8082;
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }

  # Unknown host names are not served.
  server {
    listen 8443 ssl default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
  }

  # ---- shell and core
  server {
    listen 8443 ssl;
    listen 443 ssl;
    http2 on;
    server_name shell.slg.test;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The internal tree (back-channel logout, permission API) is never reachable from outside.
    # Regex so that path parameters ("/core/internal;x=1/...") and other spellings do not slip past a prefix match.
    location ~* ^/core/internal { return 404; }

    set $core_upstream core-backend:8080;

    location /core/ {
      proxy_pass http://$core_upstream;
      include /etc/nginx/slg-proxy-headers.conf;
    }

    location = /app {
      proxy_pass http://$core_upstream;
      include /etc/nginx/slg-proxy-headers.conf;
    }

    location /app/ {
      proxy_pass http://$core_upstream;
      include /etc/nginx/slg-proxy-headers.conf;
    }

    location = / {
      return 302 /app/;
    }

    location / {
      return 404;
    }
  }

  # ---- Keycloak: only login, logout, token and well-known paths are routed (SK-15 AC1)
  server {
    listen 8443 ssl;
    listen 443 ssl;
    http2 on;
    server_name sso.slg.test;

    add_header Strict-Transport-Security "max-age=31536000" always;

    set $keycloak_upstream keycloak:8080;

    location ~ ^/realms/(slg|slg-e2e)/(protocol/openid-connect/(auth|token|certs|logout|userinfo)$|login-actions/|\.well-known/) {
      proxy_pass http://$keycloak_upstream;
      include /etc/nginx/slg-proxy-headers.conf;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
    }

    location ~ ^/resources/[^/]+/(login|common)/ {
      proxy_pass http://$keycloak_upstream;
      include /etc/nginx/slg-proxy-headers.conf;
    }

    # The admin console, the master realm and everything else stay unrouted.
    location / {
      return 404;
    }
  }
}
