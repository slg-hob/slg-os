name: CI

# Quality gate for every change to main. Branch protection requires the single check "gate" (docs/branch-protection.md).
# Rules (PRD-0003 SK-2): actions pinned to commit SHAs, no pull_request_target, read-only token by default, no secrets for forks.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TRIVY_VERSION: v0.73.0

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Index, status, link, size and secret checks
        run: node scripts/ci/check-docs.mjs
      - name: Markdown structure
        run: |
          npm ci --ignore-scripts --prefix ci/docs-tools
          ci/docs-tools/node_modules/.bin/markdownlint-cli2 "**/*.md"

  policy:
    name: Workflow, version and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Workflow policy (pinned actions, no privileged PR trigger, no integrity-weakening flags)
        run: node scripts/ci/check-workflows.mjs
      - name: Version table matches the build files
        run: node scripts/ci/check-versions.mjs
      - name: Unit tests of the CI scripts with coverage minimum
        run: >
          node --test --experimental-test-coverage --test-coverage-lines=80 --test-coverage-functions=80
          --test-coverage-include="scripts/ci/*.mjs" --test-coverage-exclude="scripts/ci/check-docs.mjs"
          "scripts/ci/test/*.test.mjs"

  backend:
    name: Backend (Maven, JaCoCo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build, unit and integration tests, line coverage gate (80 % per module)
        run: ./mvnw verify
      - name: Critical package trees (gateway, session, security) at 90 %
        run: node scripts/ci/coverage.mjs critical
      - name: Coverage report
        run: node scripts/ci/coverage.mjs report coverage-backend.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: coverage-backend.json
          retention-days: 3

  frontend:
    name: Frontend (lint, types, i18n, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lock file only, no scripts)
        run: npm ci --ignore-scripts
      - name: Lint (includes no literal user-visible strings)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: i18n key parity de/en and ICU validity
        run: npm run i18n:check
      - name: Tests with coverage gate (80 % lines per package)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Coverage report
        run: node scripts/ci/coverage.mjs report coverage-frontend.json
        working-directory: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: coverage-frontend.json
          retention-days: 3

  coverage:
    name: Coverage regression (2-point limit)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Merge the reports
        run: node scripts/ci/coverage.mjs merge coverage-current.json coverage-backend.json coverage-frontend.json
      - name: Fetch the baseline written by main
        id: baseline
        run: |
          # exit 2 of ls-remote means the branch does not exist (not seeded yet); any other failure must not pass as "unseeded"
          set +e; git ls-remote --exit-code --heads origin ci-baseline >/dev/null; rc=$?; set -e
          if [ "$rc" = 2 ]; then
            echo "state=unseeded" >> "$GITHUB_OUTPUT"
          elif [ "$rc" != 0 ]; then
            echo "::error::could not reach the repository to read the coverage baseline"; exit 1
          else
            git fetch --depth=1 origin ci-baseline:refs/remotes/origin/ci-baseline
            if git show origin/ci-baseline:baseline.json > coverage-baseline.json; then
              echo "state=present" >> "$GITHUB_OUTPUT"
            else
              echo "state=broken" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Compare with the baseline
        env:
          STATE: ${{ steps.baseline.outputs.state }}
        run: |
          case "$STATE" in
            present) node scripts/ci/coverage.mjs compare coverage-current.json coverage-baseline.json ;;
            unseeded) echo "::warning::no coverage baseline yet; the first run on main seeds it" ;;
            *) echo "::error::the branch ci-baseline exists but has no baseline.json"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-current
          path: coverage-current.json
          retention-days: 3

  coverage-baseline:
    name: Write coverage baseline (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ci-baseline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: coverage-current
      - name: Publish baseline.json to the branch ci-baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a newer commit on main will write its own baseline; never overwrite it with a stale one
          if [ "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "a newer commit exists on main, skipping"; exit 0
          fi
          mkdir ../baseline && cp coverage-current.json ../baseline/baseline.json
          cd ../baseline
          git init -q -b ci-baseline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline.json
          git commit -q -m "Coverage baseline for ${GITHUB_SHA}"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" push -q --force "https://github.com/${GITHUB_REPOSITORY}.git" ci-baseline

  e2e:
    name: End-to-end tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      COMPOSE_PROJECT_NAME: slgos-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - name: Generate the per-run secrets and the test CA (nothing here is committed or uploaded)
        run: |
          deploy/scripts/gen-secrets.sh
          deploy/scripts/test-ca.sh
      - name: Host names and CA trust for the system and the browsers
        run: |
          echo "127.0.0.1 shell.slg.test sso.slg.test" | sudo tee -a /etc/hosts
          sudo cp deploy/.generated/tls/ca.crt /usr/local/share/ca-certificates/slg-test-ca.crt
          sudo update-ca-certificates
          sudo apt-get install -y --no-install-recommends libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n slg-test-ca -i deploy/.generated/tls/ca.crt
      - name: Start the stack (production-mode Keycloak, PostgreSQL, proxy, core)
        run: |
          set -a; . deploy/.generated/e2e.env; set +a
          docker compose -f deploy/compose.yaml -f deploy/compose.e2e.yaml up -d --build --wait --wait-timeout 420
      - name: Wait until sign-in works through the proxy
        run: |
          # Keycloak reports ready before it serves the realm keys; the core re-checks every 10 s and answers 503 until then.
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --cacert deploy/.generated/tls/ca.crt 'https://shell.slg.test/core/auth/login?return=%2Fapp%2F' || true)"
            if [ "$code" = "302" ] || [ "$code" = "303" ]; then exit 0; fi
            sleep 3
          done
          echo "::error::sign-in is still unavailable after 3 minutes (last status $code)"; exit 1
      - name: Install the e2e dependencies and the browser
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run the scenarios
        working-directory: e2e
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/deploy/.generated/tls/ca.crt
        run: |
          set -a; . ../deploy/.generated/e2e.env; set +a
          npx playwright test --project=${{ matrix.browser }}
      - name: Container logs on failure
        if: failure()
        run: |
          set -a; . deploy/.generated/e2e.env; set +a
          docker compose -f deploy/compose.yaml -f deploy/compose.e2e.yaml ps -a > compose-ps.txt || true
          docker compose -f deploy/compose.yaml -f deploy/compose.e2e.yaml logs --no-color --timestamps > compose-logs.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            e2e/test-results
            e2e/playwright-report
            compose-ps.txt
            compose-logs.txt
          retention-days: 3

  security:
    name: Security (dependencies, secrets, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Populate the local Maven repository (the scanner resolves versions from it, not from Maven Central)
        run: ./mvnw -q compile dependency:resolve
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Scan (fails on high or critical findings) and write the SBOM
        env:
          SBOM_OUT: sbom.cdx.json
        run: scripts/ci/security-scan.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  compose-config:
    name: Compose configuration and hardening rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Every compose file is valid
        env:
          E2E_USER_PASSWORD: validation-only
        run: |
          docker compose -f deploy/compose.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.e2e.yaml config -q
      - name: Static hardening assertions on the merged configuration (SK-16 AC2, AC3)
        env:
          E2E_USER_PASSWORD: validation-only
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.e2e.yaml config --format json | node scripts/ci/check-compose.mjs
      - name: Shell scripts of the stack
        run: |
          for f in deploy/scripts/*.sh deploy/postgres/init/*.sh deploy/keycloak/entrypoint.sh; do bash -n "$f"; done

  gate:
    name: gate
    if: always()
    needs: [docs, policy, backend, frontend, coverage, e2e, security, compose-config]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Every required job must have succeeded (skipped counts as failure)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: docs,policy,backend,frontend,coverage,e2e,security,compose-config
        run: node scripts/ci/gate.mjs
